<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>勤務スケジュール</title>
<style>
/* White-dominant palette with navy accent and soft grey, kept light in every viewer theme by request */
:root{
  --bg:#ffffff; --surface:#f6f7f9; --surface2:#eef0f4; --line:#e3e6ec; --ink:#1c2430; --muted:#6b7482;
  --navy:#1f3a68; --navy2:#2e4f86; --navy-soft:#ebf0f7; --navy-ink:#ffffff;
  --warn:#b4483c; --warn-soft:#faeeec; --ok:#3d7a64; --ok-soft:#e9f3ef; --sat:#3f5f95;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#ffffff}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:22px 20px 72px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;justify-content:space-between;padding-bottom:14px;border-bottom:2px solid var(--navy)}
.title{font-size:26px;font-weight:700;color:var(--navy);margin:0;letter-spacing:.02em}
.title-input{font-size:22px;font-weight:700;color:var(--navy);border:1px dashed var(--line);background:transparent;padding:2px 8px;border-radius:6px;width:min(420px,100%)}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav select{font-size:20px;font-weight:700;color:var(--ink);border:0;background:transparent;padding:4px 6px;border-radius:6px;cursor:pointer;font-variant-numeric:tabular-nums}
.monthnav select:hover{background:var(--surface)}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:18px;line-height:1;display:grid;place-items:center;color:var(--navy)}
.iconbtn:hover:not(:disabled){background:var(--navy-soft)}
.langsel{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.langsel select{padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font-size:13px;color:var(--ink)}
.lockbtn{display:inline-flex;align-items:center;gap:6px}
.lockbtn svg{width:14px;height:14px}
.sheet label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.sheet input.field{width:100%}
.sheet .err{color:var(--warn);font-size:13px;min-height:1.2em;margin:0}
.sheet p.hint{margin:0}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.admin-foot{flex-wrap:wrap;justify-content:space-between!important}
#print{display:none}
@media print{
  :root{padding:0}
  html,body{background:#fff}
  #app,#layer,.toast{display:none!important}
  #print{display:block}
}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:14px 0 10px}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who label{font-size:13px;color:var(--muted)}
select.field,input.field{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.mine-count{font-size:13px;color:var(--navy);background:var(--navy-soft);padding:4px 10px;border-radius:999px}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;color:var(--ink)}
.btn:hover:not(:disabled){background:var(--surface)}
.btn.primary{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn.primary:hover:not(:disabled){background:var(--navy2)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--warn)}
.switch{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.switch input{accent-color:var(--navy)}
.notice{padding:10px 14px;border-radius:8px;background:var(--surface);color:var(--muted);font-size:13px;margin-bottom:12px}
.notice.warn{background:var(--warn-soft);color:var(--warn)}

.stats{display:flex;gap:28px;flex-wrap:wrap;padding:2px 0 14px;font-size:13px;color:var(--muted)}
.stats b{font-size:20px;color:var(--ink);font-weight:700;margin-right:4px;font-variant-numeric:tabular-nums}
.stats .open b{color:var(--warn)}
.stats .done b{color:var(--ok)}

/* admin */
details.admin{border:1px solid var(--line);border-radius:10px;margin-bottom:16px;background:var(--surface)}
details.admin>summary{padding:12px 16px;cursor:pointer;font-weight:500;color:var(--navy)}
.admin-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.5fr);gap:24px;padding:4px 16px 18px}
.admin-body h3{font-size:14px;margin:0 0 10px;color:var(--navy)}
.list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.lrow{display:flex;align-items:center;gap:6px}
.lrow input[type=text]{flex:1;min-width:0;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.lrow input[type=number]{width:4.2em;padding:6px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.lrow .unit{font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.sitebar{width:4px;height:22px;border-radius:2px;background:var(--navy);flex:none}
.xbtn{border:0;background:transparent;color:var(--muted);width:26px;height:26px;border-radius:6px;font-size:16px;line-height:1;flex:none}
.xbtn:hover{background:var(--warn-soft);color:var(--warn)}
.colhead{display:flex;gap:6px;font-size:11px;color:var(--muted);padding:0 32px 0 18px;justify-content:flex-end}
.pform{display:flex;flex-direction:column;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.prow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.prow>span{color:var(--muted);min-width:4.5em}
.prow input[type=date],.prow input[type=number],.prow select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.prow input[type=number]{width:4.5em}
.wdpick{display:flex;flex-wrap:wrap;gap:4px}
.wdpick label{display:flex;align-items:center;justify-content:center;min-width:34px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font-size:13px;cursor:pointer;user-select:none}
.wdpick input{position:absolute;opacity:0;pointer-events:none}
.wdpick label:has(input:checked){background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.wdpick label:has(input:focus-visible){outline:2px solid var(--navy);outline-offset:2px}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;gap:8px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--navy);border-radius:6px;padding:8px 8px 8px 10px;font-size:13px}
.pitem .ptxt{flex:1}
.pitem .ptxt b{color:var(--navy);font-weight:700}
.pitem .pmeta{color:var(--muted);font-size:12px}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.admin-foot{grid-column:1/-1;display:flex;gap:8px;border-top:1px solid var(--line);padding-top:12px}

/* calendar */
.cal-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.cal{display:grid;grid-template-columns:52px repeat(7,minmax(132px,1fr));min-width:980px}
.hcell{background:var(--surface);font-size:13px;font-weight:500;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.hcell.sat{color:var(--sat)}.hcell.sun{color:var(--warn)}
.wk{display:flex;justify-content:center;padding-top:12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface)}
.day{position:relative;border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:8px 8px 10px;min-height:118px;display:flex;flex-direction:column;gap:7px;background:var(--bg)}
.day.out,.day.off{background:var(--surface)}
.day.today{box-shadow:inset 0 0 0 2px var(--navy)}
.dhead{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.dnum{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.dnum small{font-size:12px;font-weight:400;color:var(--muted);margin-left:4px;display:none}
.day.sun .dnum,.day.hol .dnum{color:var(--warn)} .day.sat .dnum{color:var(--sat)}
.hol-name{font-size:11px;color:var(--warn)}
.fill{font-size:12px;padding:1px 8px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.fill.need{background:var(--warn-soft);color:var(--warn)}
.fill.ok{background:var(--ok-soft);color:var(--ok)}
.offlabel{font-size:12px;color:var(--muted)}
.site{display:flex;flex-direction:column;gap:4px;border-left:3px solid var(--navy);padding-left:7px}
.site.gone{border-left-color:var(--muted)}
.site-h{display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:12px}
.site-name{font-weight:700;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site-n{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.site-n.need{color:var(--warn)}
.stepper{display:flex;align-items:center;gap:2px;font-size:12px;flex:none}
.stepper button{width:22px;height:22px;border-radius:5px;border:1px solid var(--line);background:var(--bg);line-height:1;padding:0;color:var(--navy)}
.stepper button:hover{background:var(--navy-soft)}
.stepper output{min-width:1.6em;text-align:center;font-weight:500}
.chip{--c:#6f7a8a;display:flex;align-items:center;justify-content:space-between;gap:4px;padding:3px 3px 3px 8px;border-radius:5px;
  background:var(--surface);background:color-mix(in srgb,var(--c) 14%,#ffffff);border-left:3px solid var(--c);color:var(--ink);font-size:13px;font-weight:500;line-height:1.35}
.chip.me{box-shadow:inset 0 0 0 1.5px var(--c)}
.chip.over{opacity:.55;text-decoration:line-through}
.chip .x{border:0;background:transparent;color:var(--muted);width:20px;height:20px;border-radius:4px;font-size:14px;line-height:1;padding:0;flex:none}
.chip .x:hover{background:rgba(31,58,104,.1);color:var(--ink)}
.slot-select{width:100%;padding:4px 6px;border:1px dashed #b9c0cb;border-radius:5px;background:var(--bg);font-size:12.5px;color:var(--muted)}
.slot-select:hover{border-color:var(--navy);color:var(--navy)}
.slot-empty{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:5px;padding:3px 8px}
.addsite{width:100%;padding:3px 6px;border:1px solid transparent;border-radius:5px;background:transparent;font-size:12px;color:var(--muted)}
.addsite:hover{border-color:var(--line);color:var(--navy)}
.cal.mymode .day:not(.has-me):not(.out){opacity:.45}

/* summary */
.sum{margin-top:30px}
.sum h2{font-size:17px;color:var(--navy);margin:0 0 4px}
.sum .sub{font-size:13px;color:var(--muted);margin:0 0 10px}
.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:center;font-weight:500;color:var(--muted);font-size:12px;background:var(--surface);padding:8px 8px;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:inherit;z-index:1}
thead th:first-child{background:var(--surface)}
tbody tr{background:var(--bg)}
td{padding:9px 8px;border-top:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}
td.z{color:#c3c8d0}
td.over{color:var(--warn);font-weight:700}
th.cur,td.cur{background:var(--navy-soft)}
th.cur{color:var(--navy);font-weight:700}
td.tot,th.tot{font-weight:700;border-left:1px solid var(--line)}
tr.mine td:first-child{font-weight:700}
tr.meta td{color:var(--muted);font-size:12.5px;background:var(--surface)}
tr.meta td.open{color:var(--warn)}
.namecell{display:flex;align-items:center;gap:8px;white-space:nowrap;padding-right:8px}
.namecell .cap{font-size:11px;color:var(--muted);font-weight:400}
.daylist{margin-top:14px}
.daylist table td{text-align:left}
.daylist td.n{width:4em;text-align:center;font-weight:700}
.daylist td.dates{color:var(--muted);font-size:13px}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(20,30,50,.35);display:grid;place-items:center;padding:20px;z-index:50}
.sheet{background:var(--bg);border-radius:12px;max-width:600px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;max-height:90vh;box-shadow:0 20px 50px rgba(20,30,50,.18)}
.sheet h3{margin:0;font-size:16px;color:var(--navy)}
.sheet textarea{width:100%;min-height:320px;flex:1;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;font-size:14px;background:var(--surface);color:var(--ink);resize:vertical}
.sheet .row{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:90vw}

@media (max-width:1000px){.admin-body{grid-template-columns:1fr 1fr}.admin-body .pcol{grid-column:1/-1}}
@media (max-width:760px){
  .wrap{padding:14px 12px 56px}
  .title{font-size:21px}
  .monthnav select{font-size:17px}
  .admin-body{grid-template-columns:1fr}
  .cal-scroll{border:0;border-radius:0;overflow:visible}
  .cal{display:block;min-width:0}
  .hcell{display:none}
  .wk{display:block;background:transparent;border:0;padding:16px 2px 6px;font-weight:700;color:var(--navy);font-size:14px}
  .day{border:1px solid var(--line);border-radius:8px;margin-bottom:6px;min-height:0;display:grid;grid-template-columns:72px 1fr;gap:6px 10px;align-items:start}
  .day.out{display:none}
  .day .dhead{grid-row:span 6;flex-direction:column;align-items:flex-start;gap:3px}
  .dnum small{display:inline}
  .day>*:not(.dhead){grid-column:2}
}
</style>
</head>

  const observers={};
  const payload=(path)=>{
    if(path==='settings/main')return state.settings;

  };
  function deliver(path,cb){const value=payload(path);cb({exists:!!value,data:()=>clone(value)});}
  function emit(path){(observers[path]||[]).forEach(cb=>deliver(path,cb));}

/* needs per site for a date: patterns first, then per-day overrides */
function baseNeeds(date){
  const wd=wdOf(date),out={};
  for(const p of settings.patterns){
    if(date<p.from||date>p.until||!p.wd.includes(wd))continue;
    if(p.skipHol&&HOL[date])continue;
    out[p.site]=p.needed;
  }
  return out;
}
function needs(date){
  const out=baseNeeds(date);const ov=(days[date]&&days[date].ov)||{};
  for(const k in ov)out[k]=ov[k];
  for(const k in out)if(!(out[k]>0))delete out[k];
  return out;
}
function byDate(){
  const m={};
  for(const [id,s] of Object.entries(signups)){(m[s.date]=m[s.date]||[]).push({id,...s})}
  for(const k in m)m[k].sort((a,b)=>(a.at||0)-(b.at||0));
  return m;
}
function siteOrder(ids){
  const idx=id=>{const i=settings.sites.findIndex(s=>s.id===id);return i<0?999:i};
  return [...ids].sort((a,b)=>idx(a)-idx(b));
}
function monthGrid(ym){
  const [y,m]=ym.split("-").map(Number);
  const first=new Date(y,m-1,1),last=new Date(y,m,0).getDate();
  const cells=[];for(let i=0;i<(first.getDay()+6)%7;i++)cells.push(null);
  for(let d=1;d<=last;d++)cells.push(new Date(y,m-1,d));
  while(cells.length%7)cells.push(null);
  const weeks=[];for(let i=0;i<cells.length;i+=7)weeks.push(cells.slice(i,i+7));
  return {y,m,weeks,last};
}

function handleErr(e){
  const c=e&&e.code;
  if(c==="invalid_argument"){canWrite=false;render();toast(t("readOnly"))}
  else if(c==="quota_exceeded")toast(e.message||t("saveErr"));
  else toast(t("saveErr"));
}
function enqueue(path,fn){const p=(queues[path]||Promise.resolve()).then(fn).catch(handleErr);queues[path]=p;return p}
function setNeed(date,site,n){
  if(!db)return;
  n=Math.max(0,Math.min(20,n));
  const base=baseNeeds(date)[site]||0;
  const ov={...((days[date]&&days[date].ov)||{})};
  if(n===base)delete ov[site];else ov[site]=n;
  const empty=!Object.keys(ov).length;
  const body={date,month:date.slice(0,7),ov};
  if(empty)delete days[date];else days[date]=body;
  render();
  return enqueue("days/"+date,()=>empty?db.doc("days/"+date).delete():db.doc("days/"+date).set(body));
}
function addSignup(date,site,wid){
  if(!db||!wid)return;
  const id=date+"_"+wid;if(signups[id])return;
  const w=wById(wid);
  if(w&&w.max>0&&!(isAdmin&&adminView)){
    const cnt=Object.values(signups).filter(s=>s.worker===wid&&s.month===date.slice(0,7)).length;
    if(cnt>=w.max){toast(t("overMax")(w.name,w.max));render();return}
  }
  const body={date,month:date.slice(0,7),site,worker:wid,at:Date.now()};
  signups[id]=body;render();
  return enqueue("signups/"+id,()=>db.doc("signups/"+id).set(body));
}
function removeSignup(id){
  if(!db)return;delete signups[id];render();
  return enqueue("signups/"+id,()=>db.doc("signups/"+id).delete());
}
function saveSettings(){
  if(!db)return;
  const body={title:settings.title||"",sites:settings.sites,workers:settings.workers,patterns:settings.patterns};
  return enqueue("settings/main",()=>db.doc("settings/main").set(body));
}

function dayCell(k,d,di,wc,sig,admin){
  const nd0=needs(k),list=sig[k]||[];const sf=sById(siteFilter)?siteFilter:"";
  const nd=sf?(nd0[sf]?{[sf]:nd0[sf]}:{}):nd0;
  const siteIds=siteOrder(new Set([...Object.keys(nd),...list.filter(x=>!sf||x.site===sf).map(x=>x.site)]));
  const isWork=Object.keys(nd).length>0;
  const totalNeed=Object.values(nd).reduce((a,b)=>a+b,0);
  const totalFill=siteIds.reduce((a,s)=>a+Math.min(nd[s]||0,list.filter(x=>x.site===s).length),0);
  const hol=HOL[k];const hasMe=me&&list.some(x=>x.worker===me);
  let h=`<div class="day${isWork?"":" off"}${wc}${hol?" hol":""}${k===todayKey?" today":""}${hasMe?" has-me":""}">`;
  h+=`<div class="dhead"><span class="dnum">${d.getDate()}<small>${esc(t("wd")[di])}</small></span>${isWork?`<span class="fill ${totalFill>=totalNeed?"ok":"need"}">${totalFill}/${totalNeed}</span>`:""}</div>`;
  if(hol)h+=`<span class="hol-name">${esc(hol)}</span>`;
  if(!siteIds.length&&!admin)h+=`<span class="offlabel">${esc(t("off"))}</span>`;
  const takenToday=new Set(list.map(x=>x.worker));

    h+=`<div class="site${sById(s)?"":" gone"}"><div class="site-h"><span class="site-name" title="${esc(sName(s))}">${esc(sName(s))}</span>`;
    if(admin)h+=`<span class="stepper"><button data-act="dec" data-date="${k}" data-site="${esc(s)}" aria-label="-">−</button><output>${n}</output><button data-act="inc" data-date="${k}" data-site="${esc(s)}" aria-label="+">＋</button></span>`;
    else h+=`<span class="site-n${here.length<n?" need":""}">${Math.min(here.length,n)}/${n}</span>`;
    h+=`</div>`;
    here.forEach((x,i)=>{
      const mine=x.worker===me,canRm=canWrite&&!!db&&(admin||mine);
      h+=`<div class="chip${mine?" me":""}${i>=n?" over":""}" style="--c:${esc(wColor(x.worker))}"><span>${esc(wName(x.worker))}</span>${canRm?`<button class="x" data-act="rm" data-id="${esc(x.id)}" aria-label="remove">×</button>`:""}</div>`;
    });
    for(let i=here.length;i<n;i++){
      if(canWrite&&db&&settings.workers.length){
        const opts=settings.workers.filter(w=>!takenToday.has(w.id)).sort((a,b)=>(b.id===me)-(a.id===me));
        h+=`<select class="slot-select" data-act="assign" data-date="${k}" data-site="${esc(s)}" aria-label="${esc(t("pick"))}"><option value="">${esc(t("pick"))}</option>${opts.map(w=>`<option value="${esc(w.id)}">${esc(w.name)}${w.id===me?" "+esc(t("yours")):""}</option>`).join("")}</select>`;
      }else h+=`<div class="slot-empty">—</div>`;
    }
    h+=`</div>`;
  });
  if(admin){
    const rest=settings.sites.filter(s=>!siteIds.includes(s.id));
    if(rest.length)h+=`<select class="addsite" data-act="addsite" data-date="${k}" aria-label="${esc(t("addSite"))}"><option value="">${esc(t("addSite"))}</option>${rest.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("")}</select>`;
    if(!siteIds.length&&!rest.length)h+=`<span class="offlabel">${esc(t("noSites"))}</span>`;
  }
  return h+`</div>`;
}

function summary(sig){
  const per={};MONTHS.forEach(k=>per[k]={});
  Object.values(signups).forEach(s=>{if(!per[s.month])return;per[s.month][s.worker]=(per[s.month][s.worker]||0)+1});
  // need/open per month
  const mNeed={},mFill={};
  MONTHS.forEach(k=>{
    const {last}=monthGrid(k);let n=0,f=0;
    for(let d=1;d<=last;d++){const dk=k+"-"+pad(d),nd=needs(dk),list=sig[dk]||[];
      for(const s in nd){n+=nd[s];f+=Math.min(nd[s],list.filter(x=>x.site===s).length)}}
    mNeed[k]=n;mFill[k]=f;
  });
  const ids=[...settings.workers.map(w=>w.id)];
  Object.values(signups).forEach(s=>{if(!ids.includes(s.worker))ids.push(s.worker)});
  let h=`<section class="sum"><h2>${esc(t("summary"))}</h2><p class="sub">${esc(t("sumSub"))}</p><div class="table-scroll"><table><thead><tr><th>${esc(t("workers"))}</th>`;
  MONTHS.forEach(k=>{const [yy,mm]=k.split("-").map(Number);h+=`<th class="${k===month?"cur":""}">${esc(t("mshort")(yy,mm))}</th>`});
  h+=`<th class="tot">${esc(t("total"))}</th></tr></thead><tbody>`;
  ids.forEach(id=>{
    const w=wById(id);let tot=0;
    h+=`<tr class="${id===me?"mine":""}"><td><span class="namecell"><span class="dot" style="background:${esc(wColor(id))}"></span>${esc(wName(id))}${w&&w.max>0?`<span class="cap">≤${w.max}</span>`:""}</span></td>`;
    MONTHS.forEach(k=>{const n=per[k][id]||0;tot+=n;const over=w&&w.max>0&&n>w.max;h+=`<td class="${k===month?"cur ":""}${n?"":"z "}${over?"over":""}">${n}</td>`});
    h+=`<td class="tot">${tot}</td></tr>`;
  });
  let tn=0,to=0;
  h+=`<tr class="meta"><td>${esc(t("need"))}</td>`;MONTHS.forEach(k=>{tn+=mNeed[k];h+=`<td class="${k===month?"cur":""}">${mNeed[k]||"—"}</td>`});h+=`<td class="tot">${tn}</td></tr>`;
  h+=`<tr class="meta"><td>${esc(t("openRow"))}</td>`;MONTHS.forEach(k=>{const o=mNeed[k]-mFill[k];to+=o;h+=`<td class="${k===month?"cur ":""}${o>0?"open":""}">${mNeed[k]?o:"—"}</td>`});h+=`<td class="tot">${to}</td></tr>`;
  h+=`</tbody></table></div>`;
  // this month's dates per worker
  const [yy,mm]=month.split("-").map(Number);
  h+=`<div class="daylist"><div class="table-scroll"><table><thead><tr><th>${esc(t("month")(yy,mm))}</th><th>${esc(t("times"))}</th><th style="text-align:left">${esc(t("dayList"))}</th></tr></thead><tbody>`;
  ids.forEach(id=>{
    const ds=Object.values(signups).filter(s=>s.worker===id&&s.month===month).sort((a,b)=>a.date<b.date?-1:1);
    const multi=settings.sites.length>1;
    h+=`<tr class="${id===me?"mine":""}"><td><span class="namecell"><span class="dot" style="background:${esc(wColor(id))}"></span>${esc(wName(id))}</span></td><td class="n">${ds.length}</td><td class="dates">${ds.map(s=>esc(Number(s.date.slice(8))+"("+t("wd")[wdOf(s.date)]+")"+(multi?" "+sName(s.site):""))).join("、")||"—"}</td></tr>`;
  });
  return h+`</tbody></table></div></div></section>`;
}

function buildText(){

  let out=expSite?`${m}月（${sName(expSite)}）のスケジュールは以下の通りです。\n`:`${m}月のスケジュールは以下の通りです。\n`;
  weeks.forEach((wk,wi)=>{
    const lines=[];
    wk.forEach(d=>{if(!d)return;const k=dkey(d);let list=sig[k]||[];if(expSite)list=list.filter(x=>x.site===expSite);if(!list.length)return;
      const head=`${m}月${d.getDate()}日（${JWD[(d.getDay()+6)%7]}）`;
      if(expSite||sitesInMonth.size<=1){lines.push(head+(list.length>=2?`（${list.length}名）`:"")+"："+list.map(x=>wName(x.worker)+"さん").join("、"))}
      else{const parts=siteOrder(new Set(list.map(x=>x.site))).map(s=>{const l=list.filter(x=>x.site===s);return sName(s)+(l.length>=2?`（${l.length}名）`:"")+"："+l.map(x=>wName(x.worker)+"さん").join("、")});
        lines.push(head+"　"+parts.join("／"))}
    });
    if(lines.length)out+="\n第"+(wi+1)+"週\n"+lines.join("\n")+"\n";
  });
  void one;return out.trim();
}

document.addEventListener("input",e=>{
  const el=e.target,act=el.dataset&&el.dataset.act;if(!act)return;
  if(act==="title")drafts.title=el.value;
  else if(act==="wname")drafts["wn-"+el.dataset.id]=el.value;
  else if(act==="sname")drafts["sn-"+el.dataset.id]=el.value;
  else if(act==="newname")drafts.newname=el.value;
  else if(act==="newsite")drafts.newsite=el.value;
  else if(act==="pf-need")pf.needed=Math.max(1,Math.min(20,parseInt(el.value,10)||1));
});

  const el=e.target,act=el.dataset&&el.dataset.act;if(!act)return;
  switch(act){
    case "me":me=el.value;ls("me",me||null);render();break;
    case "lang":lang=el.value;ls("lang",lang);document.documentElement.lang=lang;render();break;
    case "impfile":{const f=el.files&&el.files[0];if(f)f.text().then(x=>{const ta=document.getElementById("imptext");if(ta)ta.value=x}).catch(()=>{});break}
    case "month":setMonth(el.value);break;

    case "assign":if(el.value)addSignup(el.dataset.date,el.dataset.site,el.value);break;
    case "addsite":if(el.value)setNeed(el.dataset.date,el.value,1);break;
    case "title":delete drafts.title;settings.title=el.value.trim();render();saveSettings();break;
    case "wname":{const id=el.dataset.id;delete drafts["wn-"+id];const w=wById(id),v=el.value.trim();if(w&&v&&v!==w.name){w.name=v;saveSettings()}render();break}
    case "sname":{const id=el.dataset.id;delete drafts["sn-"+id];const s=sById(id),v=el.value.trim();if(s&&v&&v!==s.name){s.name=v;saveSettings()}render();break}
    case "wmax":{const w=wById(el.dataset.id);if(w){const v=parseInt(el.value,10);w.max=v>0?Math.min(31,v):0;saveSettings();render()}break}
    case "pf-site":pf.site=el.value;break;
    case "pf-wd":{const i=+el.dataset.i;pf.wd=el.checked?[...new Set([...pf.wd,i])]:pf.wd.filter(x=>x!==i);break}

    case "pf-until":pf.until=el.value||"2027-12-31";break;

function addWorker(){
  const v=(drafts.newname||"").trim();if(!v)return;
  const used=settings.workers.map(w=>w.color);
  const color=PALETTE.find(c=>!used.includes(c))||PALETTE[settings.workers.length%PALETTE.length];
  settings.workers=[...settings.workers,{id:newId("w"),name:v,color,max:0}];
  drafts.newname="";render();saveSettings();
}
function addSite(){
  const v=(drafts.newsite||"").trim();if(!v)return;
  settings.sites=[...settings.sites,{id:newId("s"),name:v}];
  drafts.newsite="";render();saveSettings();
}
function addPattern(){
  if(!pf.site){toast(t("needSite"));return}
  if(!pf.wd.length){toast(t("needWd"));return}
  let from=pf.from,until=pf.until;if(from>until)[from,until]=[until,from];
  settings.patterns=[...settings.patterns,{id:newId("p"),site:pf.site,wd:[...pf.wd].sort(),needed:pf.needed,from,until,skipHol:pf.skipHol}];
  render();saveSettings();
}
async function clearMonth(){
  if(!db||busy||!confirm(t("confirmClear")))return;busy=true;render();

  busy=false;render();
}

let pwMode="";
function sheet(inner){document.getElementById("layer").innerHTML=`<div class="modal" data-act="closebg"><div class="sheet" role="dialog" aria-modal="true">${inner}</div></div>`}
const closeSheet=()=>{document.getElementById("layer").innerHTML=""};
async function sha(txt){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function readLock(){try{const s=await db.doc("lock/admin").get();return s.exists?s.data():null}catch(e){return null}}
async function askUnlock(){
  const lock=await readLock();
  if(!lock||!lock.hash){pwMode="create";
    sheet(`<h3>${esc(t("pwNewTitle"))}</h3><p class="hint">${esc(t("pwNewHint"))}</p><div class="pwform"><label class="f">${esc(t("pwNew"))}<input class="field" type="password" id="pw1" autocomplete="new-password"></label><label class="f" style="margin-top:8px">${esc(t("pwNew2"))}<input class="field" type="password" id="pw2" autocomplete="new-password"></label></div><p class="err" id="pwerr"></p><div class="row"><button class="btn" data-act="close">${esc(t("cancel"))}</button><button class="btn primary" data-act="pwok">${esc(t("pwSet"))}</button></div>`);
  }else{pwMode="unlock";
    sheet(`<h3>${esc(t("pwTitle"))}</h3><div class="pwform"><input class="field" type="password" id="pw0" placeholder="${esc(t("pwPh"))}" autocomplete="current-password"></div><p class="err" id="pwerr"></p><div class="row"><button class="btn" data-act="close">${esc(t("cancel"))}</button><button class="btn primary" data-act="pwok">${esc(t("unlock"))}</button></div>`);
  }
  const f=document.querySelector("#layer input");if(f)f.focus();
}
function askChange(){pwMode="change";
  sheet(`<h3>${esc(t("pwChange"))}</h3><div class="pwform"><label class="f">${esc(t("pwCurrent"))}<input class="field" type="password" id="pw0" autocomplete="current-password"></label><label class="f" style="margin-top:8px">${esc(t("pwNew"))}<input class="field" type="password" id="pw1" autocomplete="new-password"></label><label class="f" style="margin-top:8px">${esc(t("pwNew2"))}<input class="field" type="password" id="pw2" autocomplete="new-password"></label></div><p class="err" id="pwerr"></p><div class="row"><button class="btn" data-act="close">${esc(t("cancel"))}</button><button class="btn primary" data-act="pwok">${esc(t("pwSet"))}</button></div>`);
  const f=document.getElementById("pw0");if(f)f.focus();
}
async function pwSubmit(){
  const v=id=>{const e=document.getElementById(id);return e?e.value:""};
  const err=m=>{const e=document.getElementById("pwerr");if(e)e.textContent=m};
  const setNew=async()=>{const a=v("pw1"),b=v("pw2");
    if(a.length<4){err(t("pwShort"));return false}if(a!==b){err(t("pwMismatch"));return false}
    const salt=crypto.getRandomValues(new Uint32Array(4)).join("-");
    try{await db.doc("lock/admin").set({salt,hash:await sha(salt+"|"+a)})}catch(e){err(t("saveErr"));return false}
    return true};
  if(pwMode==="create"){if(await setNew()){unlockOk()}}
  else if(pwMode==="unlock"){const lock=await readLock();
    if(lock&&lock.hash===await sha(lock.salt+"|"+v("pw0")))unlockOk();else err(t("pwWrong"))}
  else if(pwMode==="change"){const lock=await readLock();
    if(!lock||lock.hash!==await sha(lock.salt+"|"+v("pw0"))){err(t("pwWrong"));return}
    if(await setNew()){closeSheet();toast(t("pwChanged"))}}
}

function printHTML(){
  const sig=byDate();const {y,m,weeks}=monthGrid(month);
  const used=new Set();
  weeks.flat().forEach(d=>{if(!d)return;const k=dkey(d);if(Object.keys(needs(k)).length||(sig[k]||[]).length)used.add((d.getDay()+6)%7)});
  const cols=[0,1,2,3,4,5,6].filter(i=>i<5||used.has(i));
  let h=`<div class="pp"><div class="pp-h"><div class="pp-t">${esc(settings.title||t("title"))}</div><div class="pp-m">${esc(t("month")(y,m))}</div></div><table class="pp-cal"><thead><tr><th class="wkc"></th>${cols.map(i=>`<th>${esc(t("wd")[i])}</th>`).join("")}</tr></thead><tbody>`;
  weeks.forEach((wk,wi)=>{
    if(cols.every(i=>!wk[i]))return;
    h+=`<tr><td class="wkc">${wi+1}</td>`;
    cols.forEach(i=>{const d=wk[i];
      if(!d){h+=`<td class="out"></td>`;return}
      const k=dkey(d),nd=needs(k),list=sig[k]||[],hol=HOL[k];
      const sids=siteOrder(new Set([...Object.keys(nd),...list.map(x=>x.site)]));
      h+=`<td class="${i===5?"sat":i===6?"sun":""}${hol?" hol":""}${sids.length?"":" out"}"><div class="pp-d"><b>${d.getDate()}</b>${hol?`<span class="hol">${esc(hol)}</span>`:""}</div>`;
      sids.forEach(s=>{const n=nd[s]||0,here=list.filter(x=>x.site===s),open=Math.max(0,n-here.length);
        h+=`<div class="pp-s"><div class="pp-sn">${esc(sName(s))} <span class="${open?"o":""}">${Math.min(here.length,n)}/${n}${open?" · "+esc(t("openN")(open)):""}</span></div><div class="pp-n">${here.map(x=>esc(wName(x.worker))).join("・")||"—"}</div></div>`});
      h+=`</td>`});
    h+=`</tr>`;
  });
  const cnt={};Object.values(signups).forEach(s=>{if(s.month===month)cnt[s.worker]=(cnt[s.worker]||0)+1});
  const ids=[...settings.workers.map(w=>w.id),...Object.keys(cnt).filter(id=>!wById(id))];
  const now=new Date();
  h+=`</tbody></table><div class="pp-f"><span class="lbl">${esc(t("monthTotal"))}</span>${ids.map(id=>`<span class="w"><span class="dot" style="background:${esc(wColor(id))}"></span>${esc(wName(id))} <b>${cnt[id]||0}</b></span>`).join("")}<span class="dt">${esc(t("printedAt"))} ${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}</span></div></div>`;
  return h;
}

function askImport(){
  sheet(`<h3>${esc(t("importTitle"))}</h3><p class="hint">${esc(t("importHint"))}</p><input type="file" accept=".json,application/json" data-act="impfile"><textarea id="imptext" placeholder="{ ... }" style="min-height:180px"></textarea><p class="err" id="imperr"></p><div class="row"><button class="btn" data-act="close">${esc(t("cancel"))}</button><button class="btn primary" data-act="dorestore">${esc(t("restore"))}</button></div>`);

async function doImport(){
  const ta=document.getElementById("imptext"),er=document.getElementById("imperr");
  let data;try{data=JSON.parse(ta.value)}catch(e){er.textContent=t("importBad");return}
  if(!data||data.app!=="shift-calendar"||typeof data.settings!=="object"||typeof data.days!=="object"||typeof data.signups!=="object"){er.textContent=t("importBad");return}
  if(!confirm(t("confirmImport")))return;
  closeSheet();busy=true;render();
  const st=data.settings;
  const cleanSettings={title:String(st.title||""),sites:Array.isArray(st.sites)?st.sites:[],workers:Array.isArray(st.workers)?st.workers:[],patterns:Array.isArray(st.patterns)?st.patterns:[]};
  const dayIds=Object.keys(data.days).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k));
  const sigIds=Object.keys(data.signups).filter(k=>/^[\w-]+$/.test(k));
  const delDays=Object.keys(days).filter(k=>!dayIds.includes(k));
  const delSig=Object.keys(signups).filter(k=>!sigIds.includes(k));
  const total=1+dayIds.length+sigIds.length+delDays.length+delSig.length;let done=0;
  const step=()=>{done++;if(done%10===0||done===total)toast(t("importing")(done,total))};
  try{
    await db.doc("settings/main").set(cleanSettings);step();
    for(const k of delDays){await db.doc("days/"+k).delete();step()}
    for(const k of delSig){await db.doc("signups/"+k).delete();step()}
    for(const k of dayIds){await db.doc("days/"+k).set(data.days[k]);step()}
    for(const k of sigIds){await db.doc("signups/"+k).set(data.signups[k]);step()}
    toast(t("imported"));
  }catch(e){handleErr(e)}
  busy=false;render();
}

  db.doc("settings/main").onSnapshot(s=>{
    const d=s.exists?s.data():{};
    settings={title:typeof d.title==="string"?d.title:"",
      sites:normList(d.sites,x=>({id:String(x.id),name:String(x.name||"")})),
      workers:normList(d.workers,x=>({id:String(x.id),name:String(x.name||""),color:/^#[0-9a-f]{6}$/i.test(x.color)?x.color:"#7a8494",max:Number(x.max)||0})),
      patterns:normList(d.patterns,x=>({id:String(x.id),site:String(x.site),wd:Array.isArray(x.wd)?x.wd.map(Number):[],needed:Number(x.needed)||0,from:String(x.from||RANGE_FROM),until:String(x.until||"2027-12-31"),skipHol:!!x.skipHol}))};
    markLoaded("set")},onErr);
  db.collection("days").onSnapshot(s=>{const o={};s.docs.forEach(d=>{const v=d.data();if(v&&v.ov&&typeof v.ov==="object")o[d.id]=v});days=o;markLoaded("days")},onErr);
  db.collection("signups").onSnapshot(s=>{const o={};s.docs.forEach(d=>{const v=d.data();if(v&&v.date&&v.worker)o[d.id]=v});signups=o;markLoaded("sign")},onErr);
}
if(window.claude&&window.claude.use)init();else{dbMissing=true;render()}
})();
</script>
</body>
</html>
